name: Flutter CI

on:
  push:
    branches: [main, develop]
    paths:
      - 'project-name-pocket-guardian-project-type/pocket_guardian/**'
      - '.github/workflows/flutter-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'project-name-pocket-guardian-project-type/pocket_guardian/**'

defaults:
  run:
    working-directory: project-name-pocket-guardian-project-type/pocket_guardian

jobs:
  analyze-and-test:
    name: Analyze & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.32.x"
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze code
        run: flutter analyze --no-fatal-infos

      - name: Check formatting
        run: dart format --set-exit-if-changed .

      - name: Run tests
        run: flutter test --coverage

      - name: Upload coverage
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: flutter-coverage
          path: project-name-pocket-guardian-project-type/pocket_guardian/coverage/

  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    needs: analyze-and-test

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.32.x"
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build release APK
        run: |
          flutter build apk --release \
            --dart-define=POCKET_GUARDIAN_ENV=production \
            --dart-define=POCKET_GUARDIAN_API_URL=${{ vars.API_BASE_URL || 'https://api.pocketguardian.app/api' }}

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: project-name-pocket-guardian-project-type/pocket_guardian/build/app/outputs/flutter-apk/app-release.apk

  build-ios:
    name: Build iOS (no signing)
    runs-on: macos-latest
    needs: analyze-and-test
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.32.x"
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build iOS (no code signing)
        run: |
          flutter build ios --release --no-codesign \
            --dart-define=POCKET_GUARDIAN_ENV=production \
            --dart-define=POCKET_GUARDIAN_API_URL=${{ vars.API_BASE_URL || 'https://api.pocketguardian.app/api' }}
