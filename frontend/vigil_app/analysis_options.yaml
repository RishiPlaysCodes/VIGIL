# Analysis options for Vigil Flutter app.
# Balanced between code quality and development speed.

include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"
  errors:
    invalid_annotation_target: ignore
  # REMOVED strict-casts/inference/raw-types — these break platform channel code
  # that uses dynamic types from native Android

linter:
  rules:
    # Style (warnings, not errors)
    - prefer_const_constructors
    - prefer_const_literals_to_create_immutables
    - prefer_final_fields
    - avoid_unnecessary_containers
    - sized_box_for_whitespace
    - use_key_in_widget_constructors

    # Safety
    - cancel_subscriptions
    - close_sinks
    - always_declare_return_types
