name: vigil_app
description: "Vigil - Your Personal Safety Guardian. Anti-theft and personal safety app."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # HTTP networking for Django backend API
  http: ^1.1.0

  # Local key-value storage (save settings, tokens)
  shared_preferences: ^2.2.0

  # Biometric fingerprint authentication
  local_auth: ^2.2.0

  # Runtime permissions (camera, location, etc.)
  permission_handler: ^11.1.0

  # Internationalization (date formatting)
  intl: ^0.19.0

  # File paths (for saving intruder photos)
  path_provider: ^2.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/sounds/

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
        - asset: assets/fonts/Poppins-ExtraBold.ttf
          weight: 800
