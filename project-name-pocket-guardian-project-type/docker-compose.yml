# Docker Compose for local development and staging
# Usage: docker compose up --build

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: pocket_guardian
      POSTGRES_USER: guardian
      POSTGRES_PASSWORD: ${DB_PASSWORD:-dev-password-change-me}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U guardian -d pocket_guardian"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./pocket_guardian_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY:-dev-secret-key-change-in-production}
      - DJANGO_DEBUG=${DJANGO_DEBUG:-1}
      - DJANGO_ALLOWED_HOSTS=localhost,127.0.0.1,backend
      - DATABASE_URL=postgres://guardian:${DB_PASSWORD:-dev-password-change-me}@db:5432/pocket_guardian
      - CORS_ALLOWED_ORIGINS=http://localhost:3000,http://localhost:8080
      - EMAIL_BACKEND=${EMAIL_BACKEND:-django.core.mail.backends.console.EmailBackend}
      - SMS_PROVIDER=${SMS_PROVIDER:-console}
    ports:
      - "8000:8000"
    volumes:
      - media_data:/app/media

volumes:
  postgres_data:
  media_data:
